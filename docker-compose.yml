version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: 4foods-api-mongo-1 # Giữ nguyên tên container
    restart: always
    
    # 1. BẬT XÁC THỰC: Cung cấp thông tin đăng nhập ROOT 
    environment:
      # *** BẮT BUỘC PHẢI ĐỔI MẬT KHẨU NÀY NGAY LẬP TỨC ***
      MONGO_INITDB_ROOT_USERNAME: api_admin_4foods 
      MONGO_INITDB_ROOT_PASSWORD: *Muoicham34hoaquaDhfoods%

    # 2. CHẠY MONGODB VỚI XÁC THỰC BẬT
    command: ["--auth"] 
    
    volumes:
      - 4foods-api_mongo-data:/data/db

  api:
    build: .
    container_name: 4foods-api-api-1
    restart: always
    env_file:
      - .env
    depends_on:
      - mongo
    ports:
      - "0.0.0.0:5000:5000"

volumes:
  4foods-api_mongo-data:
    external: true