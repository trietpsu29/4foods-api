version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: 4foods-api-mongo-1
    restart: always
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: api_admin_4foods 
      MONGO_INITDB_ROOT_PASSWORD: Muoicham34hoaquaDhfoods!
    command: ["--auth"] 
    ports:
      - "127.0.0.1:27017:27017" 
    volumes:
      - 4foods-api_mongo-data:/data/db

  api:
    build: .
    container_name: 4foods-api-api-1
    restart: always
    env_file:
      - .env
    depends_on:
      - mongo
    ports:
      - "0.0.0.0:5000:5000"

volumes:
  4foods-api_mongo-data:
